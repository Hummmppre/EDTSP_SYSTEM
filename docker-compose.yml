services:
  app:
    build: .
    env_file:
      - backend/.env
    environment:
      PORT: 5000
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - edtsp-mongo:/data/db
    ports:
      - "27017:27017"
    restart: unless-stopped

volumes:
  edtsp-mongo:
