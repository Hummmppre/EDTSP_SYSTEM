<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>GSI probe 2</title>
</head>
<body>
    <div id="btn"></div>
    <script>
        window.handleCredentialResponse = () => {};
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer
        onload="initGsi()"></script>
    <script>
        function initGsi() {
            google.accounts.id.initialize({
                client_id: "538122561006-f4vv20r15l70c7bieermrp76g7dq7qti.apps.googleusercontent.com",
                callback: window.handleCredentialResponse,
                auto_select: false,
                use_fedcm_for_button: true
            });
            google.accounts.id.renderButton(document.getElementById("btn"), {
                type: "standard",
                size: "large",
                theme: "outline",
                text: "signin_with",
                shape: "rectangular",
                logo_alignment: "left",
                width: 320
            });
        }
    </script>
</body>
</html>
